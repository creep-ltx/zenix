# zpkg's settings (man zpkg). One setting a line, # starts a comment.
#   channel NAME     the channel whose package list zpkg follows: testing or stable (test builds: test)
#   server URL       a server holding the repository, tried in this order (plain http:// for now), e.g.
#                    server http://nas.local:8088/zenix
#   hold NAME        keep a package as it is at -Syu (hold base: the system)
#   cache KB         the download cache's size; the installed version and the one before always stay
# No server is named yet: the stable channel on GitHub Pages comes later (DESIGN D22 step 9).
channel testing
cache 4096
